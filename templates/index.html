<!doctype html>
<html>
  <head>
    <title>Comic Generator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2000")
          no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(255, 255, 255, 0.92);
        width: 650px;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }
      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #333;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #1976d2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="text-align: center; margin: 0">Create Your Comic</h2>
      <p style="text-align: center; color: #666">
        Bring your story to life with AI-generated comics
      </p>

      <form action="/generate" method="post">
        <label>Story Prompt</label>
        <textarea name="story_prompt" rows="3" required>
A fox embarks on a quest to find the lost lantern hidden deep in the forest, overcoming challenges and discovering friendship along the way...</textarea
        >

        <div style="display: flex; gap: 15px">
          <div style="flex: 1">
            <label>Main Character Name</label>
            <input name="character_name" value="Fox" required />
          </div>
          <div style="flex: 1">
            <label>Setting</label>
            <input name="setting" value="Forest" required />
          </div>
        </div>

        <div style="display: flex; gap: 15px">
          <div style="flex: 1">
            <label>Story Tone</label>
            <select name="tone" required>
              <option value="Adventurous">Adventurous</option>
              <option value="Funny">Funny</option>
              <option value="Epic">Epic</option>
              <option value="Dark">Dark</option>
            </select>
          </div>
          <div style="flex: 1">
            <label>Art Style</label>
            <select name="art_style" required>
              <option value="Comic">Comic</option>
              <option value="Watercolor">Watercolor</option>
              <option value="Anime">Anime</option>
              <option value="Cartoon">Cartoon</option>
            </select>
          </div>
        </div>

        <button type="submit">✨ Generate Comic</button>
        <p
          style="
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 10px;
          "
        >
          Your comic will be generated in ~30 seconds
        </p>
      </form>
    </div>
  </body>
</html>
